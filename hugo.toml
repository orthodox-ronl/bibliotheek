baseURL = "/"
languageCode = "nl"
title = "Bibliotheek"
contentDir = "content-source"

# Footer «Bijgewerkt» via .GitInfo (laatste commit die dit contentbestand raakte).
enableGitInfo = true

disableKinds = ["taxonomy", "term"]

# Ruwe inputs + tekstblad-bronnen: geen Hugo-pagina's.
ignoreFiles = [
  '(?i)[/\\\\]input[/\\\\]',
  '(?i)\\.tekstblad\\.md$',
]

[params]
  linksBron = "https://orthodox-ronl.github.io/bron/"
  linksVsaTooling = "https://orthodox-ronl.github.io/VSA-tooling/"
  linksGithub = "https://github.com/orthodox-ronl/bibliotheek"
  feedback_email = "orthodoxronl@duck.com"

  # Blad-PDF downloads (index.md.pdf / translit). Standaard uit = huidige
  # situatie (bestand op de site). Aan + base = URL’s naar Cloudflare R2.
  # Zie docs/plans/pdf-r2.md. Overlays: hugo.pdf-assets.production.toml /
  # hugo.pdf-assets.preview.toml
  [params.pdfAssets]
    enabled = false
    base = ""
    # production | preview — map onder de R2-bucket
    env = "production"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
