# Overlay: blad-PDF downloads via R2-map production/
# Gebruik: hugo --config hugo.toml,hugo.pdf-assets.production.toml …
# Vul base in ná Cloudflare-proef (docs/plans/pdf-r2.md).

# PDF’s niet als page resources meenemen (R2 host downloads). Voorkomt
# ~1 GB kopiëren naar generated/site vóór de delete-stap — snellere CI.
ignoreFiles = [
  '(?i)[/\\\\]input[/\\\\]',
  '(?i)\\.tekstblad\\.md$',
  '(?i)\\.pdf$',
]

[params.pdfAssets]
  enabled = true
  # Publieke basis-URL van de bucket, eindigend op / (r2.dev of custom domein).
  base = "https://pub-16acc8d1bd9b47b684ae5c7aa3215f1d.r2.dev/"
  env = "production"
