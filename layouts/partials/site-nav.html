{{- $page := . -}}
<nav class="site-nav" aria-label="Hoofdnavigatie">
  <a href="{{ site.Home.RelPermalink }}"{{ if $page.IsHome }} aria-current="page"{{ end }}>Home</a>
  {{- $sections := sort site.Home.Sections "Weight" -}}
  {{- range $sections }}
    {{- partial "site-nav-section.html" (dict "page" $page "section" .) }}
  {{- end }}
</nav>
