<div id="score-audio-bar" class="score-audio-bar" hidden>
  <div class="score-audio-bar-inner">
    <p class="score-audio-bar-title" id="score-audio-bar-title"></p>
    <div class="score-audio-bar-row">
      <button type="button" class="score-audio-bar-btn score-audio-bar-play" aria-label="Pauzeren" aria-controls="score-audio-bar-element" aria-pressed="true">
        <span class="score-audio-bar-icon score-audio-bar-icon--pause" aria-hidden="true">❚❚</span>
        <span class="score-audio-bar-icon score-audio-bar-icon--play" aria-hidden="true">▶</span>
      </button>
      <button type="button" class="score-audio-bar-btn score-audio-bar-skip" data-skip="-10" aria-label="10 seconden terug">−10</button>
      <span class="score-audio-bar-time" aria-live="off">
        <span class="score-audio-bar-elapsed">0:00</span><span aria-hidden="true"> / </span><span class="score-audio-bar-duration">0:00</span>
      </span>
      <input type="range" class="score-audio-bar-seek" id="score-audio-bar-seek" min="0" max="1000" value="0" step="1" aria-label="Afspeelpositie" aria-controls="score-audio-bar-element">
      <button type="button" class="score-audio-bar-btn score-audio-bar-skip" data-skip="10" aria-label="10 seconden vooruit">+10</button>
      <label class="score-audio-bar-rate">
        <span class="score-audio-bar-rate-text">Snelheid</span>
        <select class="score-audio-bar-rate-select" aria-label="Afspeelsnelheid">
          <option value="0.75">0,75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1,25×</option>
          <option value="1.5">1,5×</option>
        </select>
      </label>
      <button type="button" class="score-audio-bar-btn score-audio-bar-close" aria-label="Stoppen en sluiten">×</button>
    </div>
  </div>
  <audio id="score-audio-bar-element" class="score-audio-bar-element" preload="metadata"></audio>
</div>
