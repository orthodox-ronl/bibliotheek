{{- /* Zoekformulier + resultatencontainer; data-index via relURL. */ -}}
<form id="bibliotheek-zoek-form" class="bibliotheek-zoek-form" data-index="{{ "zoek/index.json" | relURL }}" action="#" method="get" role="search">
  <label for="bibliotheek-zoek-q">Zoekterm</label>
  <div class="bibliotheek-zoek-rij">
    <input id="bibliotheek-zoek-q" name="q" type="search" autocomplete="off" placeholder="bijv. Juich voor God gehele aarde" />
    <button type="submit">Zoeken</button>
  </div>
</form>
<p id="bibliotheek-zoek-meta" class="bibliotheek-zoek-meta" aria-live="polite"></p>
<div id="bibliotheek-zoek-resultaten" class="bibliotheek-zoek-resultaten"></div>
